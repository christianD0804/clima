<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8f7ee">
    <title>Clima | Tulcingo de Valle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tema-soleado">
    <div class="pagina">

        <!-- BUSCADOR -->
        <div class="buscador">
            <input type="text" id="ciudad" placeholder="Buscar ciudad...">
            <button id="buscar" class="boton-chico">🔍</button>
            <button id="ubicacion" class="boton-chico" title="Usar mi ubicación">📍</button>
            <button id="unidad" class="boton-chico" title="Cambiar °C / °F">°F</button>
        </div>
        <p id="error" class="error-texto"></p>

        <!-- CLIMA ACTUAL -->
        <div class="tarjeta-clima">
            <div class="encabezado">
                <p class="etiqueta">EL CLIMA HOY</p>
                <h1 id="nombre-lugar">Tulcingo de Valle</h1>
                <p id="region" class="ubicacion">Puebla, México</p>
            </div>

            <div id="estado-clima" class="estado-clima">
                <span id="icono-clima" class="icono-clima">…</span>
                <p id="temperatura" class="temp-grande">-- °C</p>
                <p id="descripcion-clima">Cargando...</p>
                <p id="sensacion" class="sensacion"></p>
                <p id="minmax" class="sensacion"></p>
            </div>

            <div class="datos-clima">
                <div class="dato">
                    <span class="dato-icono">💧</span>
                    <div>
                        <p class="dato-etiqueta">Humedad</p>
                        <p id="humedad" class="dato-valor">-- %</p>
                    </div>
                </div>
                <div class="dato">
                    <span class="dato-icono">💨</span>
                    <div>
                        <p class="dato-etiqueta">Viento</p>
                        <p id="viento" class="dato-valor">-- km/h</p>
                    </div>
                </div>
                <div class="dato">
                    <span class="dato-icono">☔</span>
                    <div>
                        <p class="dato-etiqueta">Prob. lluvia</p>
                        <p id="lluvia" class="dato-valor">-- %</p>
                    </div>
                </div>
                <div class="dato">
                    <span class="dato-icono">🔆</span>
                    <div>
                        <p class="dato-etiqueta">Índice UV</p>
                        <p id="uv" class="dato-valor">--</p>
                    </div>
                </div>
                <div class="dato">
                    <span class="dato-icono">🌅</span>
                    <div>
                        <p class="dato-etiqueta">Amanecer</p>
                        <p id="amanecer" class="dato-valor">--:--</p>
                    </div>
                </div>
                <div class="dato">
                    <span class="dato-icono">🌇</span>
                    <div>
                        <p class="dato-etiqueta">Atardecer</p>
                        <p id="atardecer" class="dato-valor">--:--</p>
                    </div>
                </div>
            </div>

            <p id="consejo" class="consejo"></p>
            <p id="actualizado" class="actualizado"></p>
            <button id="actualizar" class="boton-actualizar">↻ Actualizar</button>
        </div>

        <!-- PRONÓSTICO POR HORAS -->
        <div class="tarjeta-clima">
            <p class="etiqueta">PRÓXIMAS 24 HORAS</p>
            <div id="horas" class="horas"></div>
        </div>

        <!-- PRONÓSTICO 7 DÍAS -->
        <div class="tarjeta-clima">
            <p class="etiqueta">PRÓXIMOS 7 DÍAS</p>
            <div id="dias" class="dias"></div>
        </div>

        <p class="fuente">Datos de <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
